<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minel GTM Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="16" fill="none" stroke="#2a313c" stroke-width="1"/>

  <!-- accent rule -->
  <rect x="64" y="64" width="4" height="140" rx="2" fill="#f0b429"/>

  <!-- wordmark -->
  <text x="92" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="#f0f3f7">MINEL</text>
  <text x="96" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="6" fill="#8b98a5">GTM HARNESS</text>
  <text x="96" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6a7480">gate · sequencer · audit trail — clone it, run it, zero API key</text>

  <!-- three glyphs: latch / tether / trail -->
  <g transform="translate(880,70)">
    <!-- latch: padlock -->
    <g transform="translate(0,0)">
      <rect x="6" y="26" width="40" height="32" rx="6" fill="none" stroke="#f0b429" stroke-width="3"/>
      <path d="M14 26 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#f0b429" stroke-width="3"/>
      <circle cx="26" cy="42" r="4" fill="#f0b429"/>
      <text x="26" y="82" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5">Latch</text>
    </g>
    <!-- tether: chain link -->
    <g transform="translate(84,0)">
      <ellipse cx="16" cy="30" rx="12" ry="18" fill="none" stroke="#f0b429" stroke-width="3" transform="rotate(-20 16 30)"/>
      <ellipse cx="36" cy="42" rx="12" ry="18" fill="none" stroke="#f0b429" stroke-width="3" transform="rotate(-20 36 42)"/>
      <text x="26" y="82" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5">Tether</text>
    </g>
    <!-- trail: log lines -->
    <g transform="translate(168,10)">
      <rect x="0" y="6" width="46" height="5" rx="2" fill="#f0b429"/>
      <rect x="0" y="20" width="46" height="5" rx="2" fill="#5a6472"/>
      <rect x="0" y="34" width="30" height="5" rx="2" fill="#5a6472"/>
      <text x="23" y="72" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a5">Trail</text>
    </g>
  </g>
</svg>
